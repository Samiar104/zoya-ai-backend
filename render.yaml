services:
  - type: web
    name: zoya-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: ZOYA_API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://muse.ai,http://localhost:3000,http://127.0.0.1:3000
      - key: ENVIRONMENT
        value: production
